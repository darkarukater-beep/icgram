<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ICgram">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=5">
<link rel="icon" href="favicon.ico?v=5" sizes="any">
<link rel="manifest" href="manifest.webmanifest?v=5">
<title>ICgram · ติวสอบ IC Plain (P1)</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo" id="logo">ICgram<span class="logo-dot">✦</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="btnLiked" title="โพสต์ที่กดหัวใจ" aria-label="liked">♡<span class="badge" id="likedCount"></span></button>
      <button class="icon-btn" id="btnFormula" title="ชีตสูตร" aria-label="formula">∑</button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="bottomnav">
    <button data-tab="home" class="on"><span class="ni">⌂</span><span class="nl">ฟีด</span></button>
    <button data-tab="read"><span class="ni">📖</span><span class="nl">อ่าน</span></button>
    <button data-tab="quiz" class="nav-plus"><span class="ni">＋</span><span class="nl">ข้อสอบ</span></button>
    <button data-tab="review"><span class="ni">↻</span><span class="nl">ทบทวน</span></button>
    <button data-tab="profile"><span class="ni"><img id="navAvatar" alt=""></span><span class="nl">โปรไฟล์</span></button>
  </nav>
</div>
<div id="story" class="hidden" aria-modal="true"></div>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
